name: cinema_booking
description: Hệ thống đặt vé xem phim (Flutter Web + Firebase Firestore)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  go_router: ^14.3.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true